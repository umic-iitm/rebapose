name: Copy folder inside same repo

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: "Existing folder to copy"
        required: true
        default: "pose-annotator-test"
        type: string
      new_folder:
        description: "New folder name/path"
        required: true
        default: "pose-angle-annotator"
        type: string
      branch:
        description: "Branch to modify"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  copy-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Copy folder
        env:
          SOURCE_FOLDER: ${{ inputs.source_folder }}
          NEW_FOLDER: ${{ inputs.new_folder }}
        run: |
          echo "Source folder: $SOURCE_FOLDER"
          echo "New folder: $NEW_FOLDER"

          if [ ! -d "$SOURCE_FOLDER" ]; then
            echo "ERROR: Source folder does not exist: $SOURCE_FOLDER"
            exit 1
          fi

          if [ -e "$NEW_FOLDER" ]; then
            echo "ERROR: Destination already exists: $NEW_FOLDER"
            exit 1
          fi

          mkdir -p "$(dirname "$NEW_FOLDER")"
          cp -a "$SOURCE_FOLDER" "$NEW_FOLDER"

      - name: Commit and push changes
        env:
          SOURCE_FOLDER: ${{ inputs.source_folder }}
          NEW_FOLDER: ${{ inputs.new_folder }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$NEW_FOLDER"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Copy $SOURCE_FOLDER to $NEW_FOLDER"
          git push
